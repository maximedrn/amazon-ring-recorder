name: amazon-ring-recorder

services:
  amazon-ring-recorder:
    build:
      context: .
      dockerfile: Dockerfile.app
      target: runtime
    image: amazon-ring-recorder:latest
    container_name: amazon-ring-recorder
    restart: unless-stopped
    volumes:
      - ${TOKEN_DIRECTORY:-./data}:/app/data
      - ${OUTPUT_DIRECTORY:-./data/recordings}:/app/data/recordings
    env_file:
      - .env
    depends_on:
      - ntfy
    networks:
      - internal
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 128M

  filebrowser:
    build:
      context: .
      dockerfile: Dockerfile.filebrowser
    image: filebrowser:latest
    container_name: filebrowser
    restart: unless-stopped
    group_add:
      - "100"
    environment:
      FILEBROWSER_ADMIN_USER: ${FILEBROWSER_ADMIN_USER:-admin}
      FILEBROWSER_ADMIN_PASSWORD: ${FILEBROWSER_ADMIN_PASSWORD:-}
      FILEBROWSER_SHARE_USER: ${FILEBROWSER_SHARE_USER:-share}
      FILEBROWSER_SHARE_PASSWORD: ${FILEBROWSER_SHARE_PASSWORD:-}
    volumes:
      - ${OUTPUT_DIRECTORY:-./data/recordings}:/srv
      - filebrowser_config:/config
      - filebrowser_database:/database
    depends_on:
      - amazon-ring-recorder
    networks:
      - internal
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  ntfy:
    image: binwiederhier/ntfy:latest
    container_name: ntfy
    restart: unless-stopped
    entrypoint: ["sh", "/config/ntfy-entrypoint.sh"]
    environment:
      NTFY_BASE_URL: ${NTFY_BASE_URL:-}
      NTFY_CACHE_FILE: /var/lib/ntfy/cache.db
      NTFY_AUTH_FILE: /var/lib/ntfy/user.db
      NTFY_AUTH_DEFAULT_ACCESS: deny-all
      NTFY_BEHIND_PROXY: "true"
      NTFY_LOG_LEVEL: info
      NTFY_TOPIC: ${NTFY_TOPIC:-recordings}
      NTFY_ADMIN_USER: ${NTFY_ADMIN_USER:-admin}
      NTFY_ADMIN_PASSWORD: ${NTFY_ADMIN_PASSWORD:-}
      NTFY_USER: ${NTFY_USER:-recorder}
      NTFY_PASSWORD: ${NTFY_PASSWORD:-}
    volumes:
      - ntfy_data:/var/lib/ntfy
      - ./config:/config:ro
    networks:
      - internal
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  caddy:
    image: caddy:latest
    container_name: caddy
    restart: unless-stopped
    environment:
      RING_DOMAIN: ${RING_DOMAIN:-}
      NTFY_DOMAIN: ${NTFY_DOMAIN:-}
    volumes:
      - ./config/Caddyfile:/etc/caddy/Caddyfile:ro
    networks:
      - internal
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    networks:
      - internal
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

networks:
  internal:

volumes:
  filebrowser_config:
  filebrowser_database:
  ntfy_data:
